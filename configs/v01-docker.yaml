# Local Docker mode. `docker pause` and `docker unpause` give this adapter a
# real suspend and resume, so it is the cheapest way to exercise the
# recoverable-profile benchmarks before spending anything.
id: v01-docker
notes: >
  Local Docker mode on the runner host. Not comparable with hosted providers.

run:
  repetitions: 8
  concurrency: 4
  rate: 2
  duration: 20s
  timeout: 15m

create:
  image: debian:stable-slim
  vcpus: 2
  memory_mib: 2048

providers:
  - name: local
    config:
      mode: docker
      image: debian:stable-slim

benchmarks:
  - name: lifecycle.cold-create
  - name: lifecycle.resume
  - name: execution.short-command
  - name: storage.small-files
    repetitions: 3
  - name: app.stateful-continue
    repetitions: 3
  - name: rl.env-reset.resume
    repetitions: 5
